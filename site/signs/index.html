<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mutcd-ts</title>
    <meta
      name="description"
      content="Every sign in mutcd-ts, rendered live with adjustable props."
    />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <script>
      // Resolve appearance before first paint to avoid a flash.
      {
        const theme =
          localStorage.getItem("theme") ??
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.signContrast =
          localStorage.getItem("sign-contrast") ?? "normal";
      }
    </script>
    <link rel="stylesheet" href="../src/style.css" />
  </head>
  <body>
    <header class="nav">
      <a class="brand" href="../" aria-label="mutcd-ts home">
        <span class="brand-name" id="brand-title" aria-hidden="true"></span>
      </a>
      <nav class="nav-links">
        <a href="../">Home</a>
        <a href="./" aria-current="page">Signs</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5" />
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
          </svg>
        </button>
        <button
          class="contrast-toggle"
          id="contrast-toggle"
          type="button"
          aria-label="Reduced contrast"
          aria-pressed="false"
          title="Reduced contrast"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path class="half-right" d="M12 3a9 9 0 0 1 0 18Z" />
            <path class="half-left" d="M12 3a9 9 0 0 0 0 18Z" />
          </svg>
        </button>
        <a
          class="github-link"
          href="https://github.com/brycedorn/mutcd-ts"
          target="_blank"
          rel="noopener"
          aria-label="View mutcd-ts on GitHub"
        >
          <svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
            />
          </svg>
        </a>
      </nav>
    </header>

    <div class="gallery-header">
      <h1>All signs</h1>
      <p>
        Every template renders live from parametric props. Adjust values to see
        the layout engine re-fit text and symbols.
      </p>
    </div>

    <main id="app" class="gallery"></main>

    <footer class="footer">
      <div class="footer-inner">
        <p>
          MIT licensed. Sign geometry derives from the public-domain FHWA 2024
          Standard Highway Signs. Not certified sign fabrication data.
        </p>
        <nav class="footer-links" aria-label="Footer">
          <a href="https://www.npmjs.com/package/mutcd-ts" target="_blank" rel="noopener">
            npm
          </a>
          <a href="https://github.com/brycedorn/mutcd-ts" target="_blank" rel="noopener">
            GitHub
          </a>
          <a
            href="https://github.com/brycedorn/mutcd-ts/issues"
            target="_blank"
            rel="noopener"
          >
            Issues
          </a>
        </nav>
      </div>
    </footer>

    <script type="module" src="../src/signs.ts"></script>
  </body>
</html>
